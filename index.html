<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AGHC 三维模型交互展示，直接查看项目生成的OBJ模型，支持旋转、缩放及本地文件查看。"><link rel="icon" href="data:,"><title>AGHC · 三维模型交互展示</title><link rel="stylesheet" href="viewer.css"></head>
<body><header><a class="brand" href="./">AGHC<span>三维模型交互展示</span></a><a class="source" href="https://github.com/sini57921-coder/AGHC" target="_blank" rel="noopener">开源代码</a></header>
<main><aside><div class="intro"><p class="kicker">项目成果展示</p><h1>在浏览器中<br>查看人体重建</h1><p>打开即可操作项目已生成的三维模型。</p></div><section class="model-card"><div class="model-icon" aria-hidden="true">3D</div><div><h2 id="modelName">原姿态着装模型</h2><p id="modelMeta">项目实际输出 · 纯色形体</p></div></section><section class="controls"><h2>视图</h2><div class="angles"><button data-action="front" class="active">正面</button><button data-action="side">侧面</button><button data-action="back">背面</button></div><button class="wide" data-action="reset">适应窗口</button></section><section class="controls"><h2>文件与截图</h2><label class="file-button">打开本地 OBJ<input id="fileInput" type="file" accept=".obj" hidden></label><button class="wide" id="restore">还原项目示例</button><button class="wide" id="capture">保存当前视图</button><p class="privacy">本地文件仅在浏览器读取，不上传。</p></section><div class="scope"><p>本页提供三维结果交互展示。新照片估高与模型生成由本机原型执行。</p><a href="THIRD_PARTY_NOTICES.md">资源说明</a></div></aside>
<section class="workspace" aria-label="三维模型查看区"><div class="canvas-head"><div><span class="pill">OBJ</span><span id="viewLabel">项目重建示例</span></div><div class="zoom"><button data-action="in" aria-label="放大">＋</button><button data-action="out" aria-label="缩小">−</button></div></div><div id="canvas" role="img" aria-label="可旋转缩放的三维人体模型"></div><div id="loading" role="status">正在加载三维模型…</div><div class="canvas-foot"><span id="status">准备模型</span><span>拖动旋转 · 滚轮缩放</span></div></section></main>
<script src="three.min.js"></script><script src="OBJLoader.js"></script><script src="viewer.js"></script></body></html>
